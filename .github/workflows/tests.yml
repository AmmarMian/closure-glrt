name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra io --extra geo
      - name: Lint
        run: uv run ruff check src tests experiments
      - name: Tests (CPU backends; the GPU ones are skipped)
        run: uv run pytest -q
