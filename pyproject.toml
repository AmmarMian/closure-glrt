[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "closure-glrt"
version = "0.1.0"
description = "Scale-free GLRT for InSAR closure phases with heterogeneous per-cell precision."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
gpu = ["torch>=2.2"]   # vectorised GLRT on many zones (closure_glrt.glrt accepts torch tensors)
io = ["h5py>=3.10"]    # OPERA CSLC reader

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/closure_glrt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
