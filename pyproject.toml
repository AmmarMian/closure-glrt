[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "closure-glrt"
version = "0.1.0"
description = "Scale-free GLRT for InSAR closure phases with heterogeneous per-cell precision."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.15.0",   # closure_glrt.backend (copied from HDR) imports torch; complex64 on MPS needs 2.15
    "zarr>=3",         # stores
]

[project.optional-dependencies]
cupy = ["cupy-cuda12x>=13"]
jax = ["jax>=0.4", "jaxlib>=0.4"]
io = ["h5py>=3.10"]    # OPERA CSLC reader

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/closure_glrt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
